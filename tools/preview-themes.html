<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista previa de temas · Convite</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="../css/invite.css">
  <style>
    body { margin: 0; padding: 24px 16px 48px; background: #2a2724; font-family: system-ui, sans-serif; color: #eee; }
    h1 { margin: 0 0 4px; font-size: 1.2rem; }
    p.lead { margin: 0 0 20px; color: #b8b2a8; font-size: .9rem; }
    .grid { display: flex; flex-wrap: wrap; gap: 28px; align-items: flex-start; }
    .pv { width: 390px; max-width: 100%; }
    .pv > b { display: block; margin: 0 0 8px; font-size: .85rem; letter-spacing: .04em; }
    .pv > b span { margin-left: 8px; padding: 2px 8px; border-radius: 99px; background: #4a453f; font-weight: 400; font-size: .72rem; }
    .pv > b span.premium { background: #d4af37; color: #1a1408; }
    .pv .inv { min-height: 0; border-radius: 18px; --px: 24px; }
    .pv .stress { width: 320px; max-width: 100%; margin-top: 14px; }
    .pv .stress .inv { --px: 28px; }
    .pv small { display: block; margin: 14px 0 6px; color: #b8b2a8; font-size: .75rem; }
    .pv .ok { color: #7fd99a; } .pv .bad { color: #ff8a80; font-weight: 700; }
    .env-host .inv, .env-host .inv-brand { display: none; }
    .bar { flex-wrap: wrap; display: flex; gap: 10px; align-items: center; margin: 0 0 20px; font-size: .9rem; }
    .bar select, .bar button { font: inherit; padding: 6px 12px; border-radius: 8px; border: 1px solid #5a554e; background: #3a3631; color: #eee; cursor: pointer; }
  </style>
</head>
<body>
  <h1>Temas de Convite</h1>
  <p class="lead">12 temas con datos de ejemplo: pase de invitado (Familia Pérez, 4 pases), recepción y una tarjeta de texto largo a 320 px con revisión de desbordamiento.</p>
  <div class="bar">
    <label for="envTheme">Sobre animado:</label>
    <select id="envTheme"></select>
    <button id="envBtn" type="button">Mostrar sobre</button>
    <span>(se cierra al abrirlo o con Esc)</span>
  </div>
  <div class="grid" id="grid"></div>
  <script type="module">
    import { THEMES } from '../js/themes.js';
    import { render } from '../js/render.js';

    const base = {
      cumple:  { e: 'cumple',  h: 'Sofía Morales', s: 'Mis 30 años', x: 'Ven a celebrar conmigo una noche de música, risas y buena comida.' },
      xv:      { e: 'xv',      h: 'Valentina', s: 'Mis XV años', x: 'Quiero compartir contigo el día más especial de mi vida.' },
      boda:    { e: 'boda',    h: 'Ana & Carlos', s: 'Nuestra boda', x: 'Con la bendición de nuestras familias, queremos compartir nuestra alegría contigo.' },
      baby:    { e: 'baby',    h: 'Baby Mateo', s: 'Baby shower', x: 'Una pequeña sorpresa viene en camino. ¡Acompáñanos a recibirla!' },
    };
    const byTheme = {
      clasico: 'boda', fiesta: 'cumple', minimal: 'cumple', cielo: 'baby',
      floral: 'boda', dorado: 'boda', 'xv-rosa': 'xv', 'boda-salvia': 'boda',
      'bebe-azul': 'baby', 'bebe-rosa': 'baby', noche: 'xv', tropical: 'cumple',
    };
    const extra = {
      d: '2027-03-20T19:00', l: 'Salón Los Jardines', a: '5a avenida 10-20, zona 10, Ciudad de Guatemala',
      c: 'Formal', g: 'Liverpool y Amazon', w: '50212345678',
      f: 'Sus padres Rosa Méndez y Luis Pérez',
      n: 'Hacienda Santa Lucía', b: 'Km 14.5 Carretera a El Salvador', o: '21:30',
    };
    const guest = { name: 'Familia Pérez', passes: 4 };
    const long = 'María de los Ángeles Hernández Castillo y José Fernando Rodríguez';
    const msg400 = ('Queremos compartir contigo un día que nunca olvidaremos, rodeados de la gente que más queremos. '
      + 'Tu presencia es el mejor regalo y nos haría muy felices verte allí celebrando con nosotros. ').repeat(2).slice(0, 400);
    const stress = {
      h: long, s: 'Celebración de nuestro compromiso y bienvenida a la familia', x: msg400,
      d: '2027-03-20T19:00', w: '50212345678', c: 'Formal elegante, colores claros, sin jeans',
      l: 'Salón de Eventos Los Jardines de la Hacienda Santa Magdalena de las Flores',
      a: 'Kilómetro 14.5 Carretera a El Salvador, Condominio Residencial Las Orquídeas, Santa Catarina Pinula',
      f: long, n: 'Restaurante y Terraza Panorámica Vista Hermosa del Volcán de Agua', b: 'Diagonal 6, 12-42 Zona 10, Edificio Design Center, Nivel 12',
      o: '21:30', g: 'Mesa de regalos en Liverpool, Amazon y transferencia bancaria ' + 'x'.repeat(40),
    };
    const stressGuest = { name: 'Familia Hernández Castillo de los Ángeles', passes: 12 };

    const grid = document.getElementById('grid');
    const sel = document.getElementById('envTheme');
    const mk = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; };

    for (const t of THEMES) {
      sel.append(new Option(`${t.id} · ${t.name}`, t.id));
      const cell = mk('div', 'pv');
      const label = mk('b', '', `${t.id} · ${t.name}`);
      const tag = mk('span', t.premium ? 'premium' : '', t.premium ? 'premium' : 'gratis');
      label.append(tag);
      const holder = mk('div');
      const sHold = mk('div', 'stress');
      const status = mk('small', '', 'Texto largo a 320px');
      cell.append(label, holder, status, sHold);
      grid.append(cell);
      const d = { ...base[byTheme[t.id]], ...extra, t: t.id };
      render(holder, d, { premium: true, preview: true, guest });
      render(sHold, { ...stress, e: d.e, t: t.id }, { premium: true, preview: true, guest: stressGuest });
      // Revisa desbordamiento horizontal cuando carguen las fuentes
      document.fonts.ready.then(() => setTimeout(() => {
        const card = sHold.querySelector('.inv');
        const wide = [card, ...card.querySelectorAll('*')].filter((n) => n.scrollWidth > n.clientWidth + 1 && getComputedStyle(n).display !== 'inline');
        const out = card.scrollWidth > card.clientWidth + 1 || wide.length;
        status.textContent = out ? 'Texto largo a 320px: DESBORDA (' + (wide[0]?.className || 'inv') + ')' : 'Texto largo a 320px: sin desbordamiento';
        status.className = out ? 'bad' : 'ok';
      }, 400));
    }

    // Sobre animado del tema elegido
    let envHost;
    const showEnvelope = () => {
      envHost?.remove();
      envHost = mk('div', 'env-host');
      document.body.append(envHost);
      const t = sel.value;
      const d = { ...base[byTheme[t]], ...extra, t };
      render(envHost, d, { premium: true, preview: false, guest });
    };
    document.getElementById('envBtn').addEventListener('click', showEnvelope);
    addEventListener('keydown', (e) => { if (e.key === 'Escape') document.querySelector('.inv-envelope')?.remove(); });
    // ?env=<tema> abre el sobre directo (útil para capturas)
    const q = new URLSearchParams(location.search).get('env');
    if (q) { sel.value = q; showEnvelope(); }
  </script>
</body>
</html>
